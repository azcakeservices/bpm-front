<div *ngIf="isOpen"
     class="fixed inset-0 z-50"
     (keydown.escape)="close()"
     role="dialog"
     aria-modal="true"
     tabindex="-1">

  <!-- overlay -->
  <div class="absolute inset-0 bg-black/50" (click)="close()"></div>

  <!-- full-page padded container -->
  <div class="absolute inset-0 p-4 sm:p-6 md:p-10">
    <!-- modal panel fills available area with padding & scroll -->
    <div class="relative w-full h-full rounded-2xl shadow-2xl
                bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100
                p-6 md:p-8 overflow-y-auto">

      <!-- close button -->
      <button type="button"
              (click)="close()"
              aria-label="Close"
              class="absolute top-4 right-4 text-slate-500 hover:text-slate-800 dark:hover:text-slate-300">
        ✕
      </button>

      <h2 class="text-xl font-semibold mb-6">Yeni əməkdaş</h2>

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">

        <!-- CreatedBy -->
        <div>
          <label for="createdBy" class="block mb-1 text-sm">Yaradan</label>
          <input id="createdBy"
                 formControlName="createdBy"
                 type="text"
                 class="w-full rounded-xl px-3 py-2 bg-slate-100 dark:bg-slate-800
                        focus:outline-none focus:ring-2 focus:ring-blue-500 border border-transparent">
        </div>

        <!-- Dynamic Questions -->
        <div class="pt-2">
          <h3 class="text-sm font-semibold text-slate-500 mb-3">Suallar</h3>

          <!-- один столбец на всех брейкпоинтах -->
          <div formGroupName="answers" class="grid grid-cols-1 gap-4">
            <div *ngFor="let q of questions;">
              <label class="block text-sm">
                {{ q.label }}
                <span *ngIf="q.isRequired" class="text-rose-500">*</span>
              </label>

              <ng-container [ngSwitch]="uiType(q)">
                <!-- text (default) -->
                <input *ngSwitchCase="'text'"
                       [formControlName]="controlName(q)"
                       type="text"
                       [placeholder]="q.placeHolder || ''"
                       class="w-full rounded-xl px-3 py-2 bg-slate-100 dark:bg-slate-800
                              focus:outline-none focus:ring-2 focus:ring-blue-500 border border-transparent" />

                <!-- number -->
                <input *ngSwitchCase="'number'"
                       [formControlName]="controlName(q)"
                       type="text"
                       [placeholder]="q.placeHolder || ''"
                       class="w-full rounded-xl px-3 py-2 bg-slate-100 dark:bg-slate-800
                              focus:outline-none focus:ring-2 focus:ring-blue-500 border border-transparent" />

                <!-- email -->
                <input *ngSwitchCase="'email'"
                       [formControlName]="controlName(q)"
                       type="email"
                       [placeholder]="q.placeHolder || ''"
                       class="w-full rounded-xl px-3 py-2 bg-slate-100 dark:bg-slate-800
                              focus:outline-none focus:ring-2 focus:ring-blue-500 border border-transparent" />

                <!-- tel -->
                <input *ngSwitchCase="'tel'"
                       [formControlName]="controlName(q)"
                       type="tel"
                       [placeholder]="q.placeHolder || ''"
                       class="w-full rounded-xl px-3 py-2 bg-slate-100 dark:bg-slate-800
                              focus:outline-none focus:ring-2 focus:ring-blue-500 border border-transparent" />

                <!-- date -->
                <input *ngSwitchCase="'date'"
                       [formControlName]="controlName(q)"
                       type="date"
                       class="w-full rounded-xl px-3 py-2 bg-slate-100 dark:bg-slate-800
                              focus:outline-none focus:ring-2 focus:ring-blue-500 border border-transparent" />

                <!-- boolean -->
                <label *ngSwitchCase="'boolean'" class="inline-flex items-center gap-2 select-none">
                  <input type="checkbox" [formControlName]="controlName(q)"
                         class="h-4 w-4 rounded border-slate-300 accent-blue-600">
                  <span class="text-sm">{{ q.placeHolder || q.label }}</span>
                </label>

                <!-- image / unknown → text -->
                <input *ngSwitchDefault
                       [formControlName]="controlName(q)"
                       type="text"
                       [placeholder]="q.placeHolder || ''"
                       class="w-full rounded-xl px-3 py-2 bg-slate-100 dark:bg-slate-800
                              focus:outline-none focus:ring-2 focus:ring-blue-500 border border-transparent" />
              </ng-container>

              <!-- errors -->
              <div class="text-xs text-rose-500 mt-1"
                   *ngIf="form.get('answers.' + controlName(q))?.touched && form.get('answers.' + controlName(q))?.invalid">
                <ng-container *ngIf="form.get('answers.' + controlName(q))?.errors as e">
                  <span *ngIf="e['required']">Tələb olunur.</span>
                  <span *ngIf="e['requiredTrue']">Qutu işарələnməlidir.</span>
                  <span *ngIf="e['email']">Email düzgün deyil.</span>
                  <span *ngIf="e['pattern']">Dəyər düzgün formatda deyil.</span>
                  <span *ngIf="e['maxlength']">Maksimum uzunluq keçildi.</span>
                </ng-container>
              </div>
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="pt-2 flex justify-end gap-3">
          <button type="button"
                  (click)="close()"
                  class="px-4 py-2 rounded-xl border border-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
            İmtina
          </button>

          <button type="submit"
                  [disabled]="form.invalid"
                  class="px-4 py-2 rounded-xl bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed">
            Yadda saxla
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

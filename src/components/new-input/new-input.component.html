<div *ngIf="isOpen"
     class="fixed inset-0 z-50 flex items-center justify-center"
     (keydown.escape)="close()"
     tabindex="-1" >
  <!-- overlay -->
  <div class="absolute inset-0 bg-black/50" (click)="close()"></div>

  <!-- modal -->
  <div class="relative z-10 w-[92%] max-w-md rounded-2xl shadow-2xl
                bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 p-6
                animate-[fade-in_0.18s_ease-out]">
    <button (click)="close()"
            class="absolute top-3 right-3 text-slate-500 hover:text-slate-800 dark:hover:text-slate-300">✕</button>

    <h2 class="text-xl font-semibold mb-4">Yeni input</h2>

    <form (ngSubmit)="submit()" [formGroup]="form" class="space-y-4">
      <!-- name -->
      <div>
        <label class="block mb-1 text-sm">Adı</label>
        <input #nameInput
               formControlName="name"
               type="text"
               class="w-full rounded-xl px-3 py-2 bg-slate-100 dark:bg-slate-800
                        focus:outline-none focus:ring-2 focus:ring-blue-500
                        border border-transparent"
               placeholder="məs., 'İstifadəçi adı'"/>
        <div *ngIf="form.controls.name.touched && form.controls.name.invalid"
             class="mt-1 text-xs text-red-500">
          Adı tələb olunur
        </div>
      </div>

      <div>
        <label class="block mb-1 text-sm">Növ</label>
        <select formControlName="type"
                class="w-full rounded-xl px-3 py-2 bg-slate-100 dark:bg-slate-800
                         focus:outline-none focus:ring-2 focus:ring-blue-500
                         border border-transparent">
          <option value="" disabled selected>Seçin...</option>
          <option *ngFor="let t of inputTypes" [value]="t.type">
            {{ t.name }} ({{ t.type }})
          </option>
        </select>
        <div *ngIf="form.controls.type.touched && form.controls.type.invalid"
             class="mt-1 text-xs text-red-500">
          Növ tələb olunur
        </div>
      </div>

      <div class="pt-2 flex justify-end gap-3">
        <button type="button"
                class="px-4 py-2 rounded-xl border border-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:cursor-pointer"
                (click)="close()">İmtina</button>

        <button type="submit"
                class="px-4 py-2 rounded-xl bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed hover:cursor-pointer"
                [disabled]="form.invalid">Yadda saxla</button>
      </div>
    </form>
  </div>
</div>

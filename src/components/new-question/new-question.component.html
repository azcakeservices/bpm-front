<div *ngIf="isOpen"
     class="fixed inset-0 z-50 flex items-center justify-center"
     (keydown.escape)="close()"
     role="dialog"
     aria-modal="true"
     tabindex="-1">

  <!-- overlay -->
  <div class="absolute inset-0 bg-black/50" (click)="close()"></div>

  <!-- modal -->
  <div class="relative z-10 w-[92%] max-w-md rounded-2xl shadow-2xl
              bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 p-6
              animate-[fade-in_0.18s_ease-out]">
    <!-- close button -->
    <button type="button"
            (click)="close()"
            aria-label="Close"
            class="absolute top-3 right-3 text-slate-500 hover:text-slate-800 dark:hover:text-slate-300">✕</button>

    <h2 class="text-xl font-semibold mb-4">Yeni sual</h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <!-- Label -->
      <div>
        <label for="label" class="block mb-1 text-sm">Başlıq</label>
        <input #firstInput
               id="label"
               formControlName="label"
               type="text"
               class="w-full rounded-xl px-3 py-2 bg-slate-100 dark:bg-slate-800
                      focus:outline-none focus:ring-2 focus:ring-blue-500 border border-transparent"
               placeholder="məs., 'İstifadəçi adı'">
        <div *ngIf="form.controls.label.touched && form.controls.label.invalid"
             class="mt-1 text-xs text-red-500">
          Başlıq tələb olunur (max 300 simvol).
        </div>
      </div>

      <!-- Placeholder -->
      <div>
        <label for="placeholder" class="block mb-1 text-sm">Placeholder</label>
        <input id="placeholder"
               formControlName="placeholder"
               type="text"
               class="w-full rounded-xl px-3 py-2 bg-slate-100 dark:bg-slate-800
                      focus:outline-none focus:ring-2 focus:ring-blue-500 border border-transparent"
               placeholder="məs., 'Adınızı daxil edin'">
        <div *ngIf="form.controls.placeholder.touched && form.controls.placeholder.invalid"
             class="mt-1 text-xs text-red-500">
          Placeholder tələb olunur (max 200 simvol).
        </div>
      </div>

      <!-- Input Type -->
      <div>
        <label for="inputId" class="block mb-1 text-sm">Növ</label>
        <select id="inputId"
                formControlName="inputId"
                class="w-full rounded-xl px-3 py-2 bg-slate-100 dark:bg-slate-800
                       focus:outline-none focus:ring-2 focus:ring-blue-500 border border-transparent">
          <option value="">Seçin...</option>
          <option *ngFor="let t of inputs" [value]="t.id">
            {{ t.label }} ({{ t.type }})
          </option>
        </select>
        <div *ngIf="form.controls.inputId.touched && form.controls.inputId.invalid"
             class="mt-1 text-xs text-red-500">
          Növ tələb olunur.
        </div>
      </div>

      <!-- CreatedBy -->
      <div>
        <label for="createdBy" class="block mb-1 text-sm">Yaradan</label>
        <input id="createdBy" formControlName="createdBy" type="text" class="w-full rounded-xl px-3 py-2 bg-slate-100 dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 border border-transparent" >
      </div>

      <!-- IsRequired -->
      <div class="pt-1">
        <label class="inline-flex items-center gap-2">
          <input type="checkbox"
                 formControlName="isRequired"
                 class="h-4 w-4 rounded border-slate-300">
          <span class="text-sm">Məcburidir</span>
        </label>
      </div>

      <!-- Actions -->
      <div class="pt-2 flex justify-end gap-3">
        <button type="button"
                (click)="close()"
                class="px-4 py-2 rounded-xl border border-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:cursor-pointer">
          İmtina
        </button>

        <button type="submit"
                [disabled]="form.invalid"
                class="px-4 py-2 rounded-xl bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed hover:cursor-pointer">
          Yadda saxla
        </button>
      </div>
    </form>
  </div>
</div>

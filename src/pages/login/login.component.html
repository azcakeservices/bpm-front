<div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
  <div class="relative w-full max-w-md bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-8 text-white">

    <h2 class="text-2xl font-bold text-center mb-6">🛡️ Giriş Paneli</h2>

    <form (ngSubmit)="login()" class="space-y-5">
      <div>
        <label for="username" class="block mb-1 font-medium">👤 İstifadəçi adı</label>
        <input
          id="username"
          name="username"
          [(ngModel)]="username"
          required
          type="text"
          placeholder="İstifadəçi adınızı daxil edin"
          class="w-full rounded-lg border border-gray-300 bg-white/20 px-3 py-2 text-white placeholder-gray-300 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400 outline-none"
        />
      </div>

      <div>
        <label for="password" class="block mb-1 font-medium">🔒 Şifrə</label>
        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="password"
            required
            placeholder="Şifrənizi daxil edin"
            class="w-full rounded-lg border border-gray-300 bg-white/20 px-3 py-2 pr-10 text-white placeholder-gray-300 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400 outline-none"
          />
          <button
            type="button"
            (click)="togglePassword()"
            class="absolute inset-y-0 right-3 flex items-center text-gray-300 hover:text-white transition"
            tabindex="-1"
            aria-label="Şifrəni göstər/gizlət"
          >
            <ng-container *ngIf="showPassword; else hideIcon">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                   viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
                   class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M2.25 12c2.25-4.5 6.75-7.5 9.75-7.5s7.5 3 9.75 7.5c-2.25 4.5-6.75 7.5-9.75 7.5s-7.5-3-9.75-7.5z" />
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </ng-container>

            <ng-template #hideIcon>
              <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                   viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
                   class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M3.98 8.223A10.477 10.477 0 002.25 12c2.25 4.5 6.75 7.5 9.75 7.5 1.387 0 2.747-.313 3.98-.897M6.228 6.228A10.45 10.45 0 0112 4.5c3 0 7.5 3 9.75 7.5-.479.959-1.08 1.824-1.77 2.573M6.228 6.228L3 3m0 0l18 18m-18-18l3.228 3.228M21 21l-3.228-3.228" />
              </svg>
            </ng-template>
          </button>
        </div>
      </div>


      <button
        type="submit"
        class="w-full py-2 rounded-lg bg-cyan-500 text-black font-bold hover:bg-cyan-400 transition-colors"
      >
        🚀 Daxil ol
      </button>
    </form>

    <div *ngIf="errorMessage"
         class="mt-4 rounded-md bg-red-500/20 text-red-200 text-center px-4 py-2">
      ⚠️ İstifadəçi adı və ya şifrə düzgün deyil
    </div>
  </div>
</div>

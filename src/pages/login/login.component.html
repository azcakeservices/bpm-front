
<div class="login-page">

  <!-- HEADER -->

  <header class="page-header">

    <div class="brand">
      <span class="brand-name">AZCAKE</span>
      <span class="brand-subtitle">
        BUSINESS INTELLIGENCE
      </span>
    </div>

    <div class="portal-label">
      <span class="portal-indicator"></span>
      CORPORATE PORTAL
    </div>

  </header>

  <!-- MAIN CONTENT -->

  <main class="login-main">

    <div class="login-container">

      <div class="login-form">

        <!-- LOGO -->

        <div class="login-emblem">

          <svg
            width="36"
            height="36"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round">

            <path d="M3 3v18h18"/>
            <path d="M7 16l5-6 4 3 5-8"/>
            <path d="M16 5h5v5"/>

          </svg>

        </div>

        <!-- TITLE -->

        <div class="login-heading">

          <span class="heading-label">
            AZCAKE BUSINESS
          </span>

          <h1>Xoş gəlmisiniz</h1>

          <p>Satış və Analitika Sistemi</p>

        </div>

        <div class="gold-divider"></div>

        <!-- LOGIN FORM -->

        <form
          (ngSubmit)="login()"
          [attr.aria-busy]="isLoading">

          <!-- USERNAME -->

          <div class="form-group">

            <label for="username">
              İstifadəçi adı
            </label>

            <div
              class="input-wrapper"
              [class.input-disabled]="isLoading">

              <svg
                class="input-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round">

                <circle cx="12" cy="8" r="4"/>

                <path
                  d="M4 21v-2a8 8 0 0 1 16 0v2"/>

              </svg>

              <input
                type="text"
                id="username"
                name="username"
                [(ngModel)]="username"
                [disabled]="isLoading"
                autocomplete="username"
                placeholder="İstifadəçi adınızı daxil edin"
                class="form-control"
                required
              />

            </div>

          </div>

          <!-- PASSWORD -->

          <div class="form-group">

            <label for="password">
              Şifrə
            </label>

            <div
              class="input-wrapper"
              [class.input-disabled]="isLoading">

              <svg
                class="input-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round">

                <rect
                  x="4"
                  y="10"
                  width="16"
                  height="11"
                  rx="2"/>

                <path
                  d="M8 10V7a4 4 0 0 1 8 0v3"/>

              </svg>

              <input
                [type]="showPassword ? 'text' : 'password'"
                id="password"
                name="password"
                [(ngModel)]="password"
                [disabled]="isLoading"
                autocomplete="current-password"
                placeholder="Şifrənizi daxil edin"
                class="form-control"
                required
              />

              <!-- SHOW / HIDE PASSWORD -->

              <button
                type="button"
                class="password-toggle"
                (click)="togglePassword()"
                [disabled]="isLoading"
                [attr.aria-label]="
                  showPassword
                    ? 'Şifrəni gizlət'
                    : 'Şifrəni göstər'
                ">

                <svg
                  *ngIf="!showPassword"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round">

                  <path
                    d="M2 12s4-7 10-7 10 7 10 7
                       -4 7-10 7-10-7-10-7z"/>

                  <circle cx="12" cy="12" r="3"/>

                </svg>

                <svg
                  *ngIf="showPassword"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round">

                  <path d="M3 3l18 18"/>

                  <path
                    d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>

                  <path
                    d="M9.9 5.2A11 11 0 0 1 12 5
                       c6 0 10 7 10 7
                       a17 17 0 0 1-3 3.6"/>

                  <path
                    d="M6.2 6.2C3.5 8.3 2 12 2 12
                       s4 7 10 7a10 10 0 0 0 5.8-1.8"/>

                </svg>

              </button>

            </div>

          </div>

          <!-- LOGIN BUTTON -->

          <button
            type="submit"
            class="btn-login"
            [class.loading]="isLoading"
            [disabled]="isLoading">

            <ng-container *ngIf="!isLoading">

              <span>Daxil ol</span>

              <svg
                class="button-arrow"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">

                <path d="M5 12h14"/>
                <path d="m12 5 7 7-7 7"/>

              </svg>

            </ng-container>

            <ng-container *ngIf="isLoading">

              <span
                class="login-spinner"
                aria-hidden="true">
              </span>

              <span>Giriş edilir...</span>

            </ng-container>

          </button>

          <!-- ERROR MESSAGE -->

          <div
            *ngIf="errorMessage"
            class="error-message"
            role="alert">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round">

              <circle cx="12" cy="12" r="10"/>
              <path d="M12 8v5"/>
              <path d="M12 16h.01"/>

            </svg>

            <span>{{ errorMessage }}</span>

          </div>

        </form>

        <!-- SECURITY LABEL -->

        <div class="security-label">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round">

            <path d="M12 22 4 18V5l8-3 8 3v13z"/>
            <path d="m9 12 2 2 4-5"/>

          </svg>

          <span>Təhlükəsiz korporativ giriş</span>

        </div>

      </div>

      <div class="access-notice">
        Yalnız səlahiyyətli istifadəçilər üçün
      </div>

    </div>

  </main>

  <!-- FOOTER -->

  <footer class="page-footer">

    <span>
      © {{ currentYear }} AZCAKE.
      Bütün hüquqlar qorunur.
    </span>

    <span class="footer-platform">
      Business Analytics Platform
    </span>

  </footer>

</div>

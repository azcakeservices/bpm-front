<div class="p-3 h-[calc(100vh-65px)] bg-[rgba(255, 255, 255, 0.05)] text-white">
  <div class="text-center mx-auto px-5 ">
    <h1 class="font-bold text-4xl">Suallar</h1>
  </div>

  <div class="flex justify-between p-3">
    <div class="flex gap-2 justify-between p-3">
      <label for="search">Axtarış etmək üçün: </label>
      <input type="text" id="search" placeholder="yazın..." (input)="search()" class="bg-white text-black text-center placeholder:text-gray-500" [(ngModel)]="searchField">
    </div>
    <button class="px-4 py-2 rounded-md bg-green-500 text-white hover:cursor-pointer hover:bg-green-300 hover:text-black hover:shadow-lg active:translate-1 duration-500"
            (click)="openCreateModal()">
      + Yeni
    </button>

  </div>

  <div class="p-5">
    <table class="w-full border text-center">
      <thead>
      <tr class="border">
        <th class="border">Sual</th>
        <th class="border">Nümunə mətn</th>
        <th class="border">Statusu</th>
        <th class="border">Tərəfindən əlavə edilib</th>
        <th class="border">Əlavə edilmə tarixi</th>
        <th class="border">Əməliyyatlar</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let question of filteredQuestions" class="border duration-300 hover:bg-blue-300">
        <td class="border py-2">{{question.label}}</td>
        <td class="border py-2">{{question.placeHolder}}</td>
        <td class="border py-2" [ngClass]="question.isActive ? 'bg-green-400' : 'bg-red-400'">{{question.isActive ? 'Aktiv' : 'Deaktiv'}}</td>
        <td class="border py-2">{{question.createdBy}}</td>
        <td class="border py-2">{{question.createdDate | date: 'dd.MM.yyyy HH:mm:ss'}}</td>
        <td>
          <div class="flex justify-around">
            <button type="button" (click)="toggleStatus(question.id, question.isActive)" [ngClass]="question.isActive ? 'bg-red-500' : 'bg-green-500'" class="inline-flex items-center px-3 py-2 border border-gray-300 rounded-lg hover:cursor-pointer hover:text-white transition-colors duration-200">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                   class="w-5 h-5 mr-1" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v10" />
                <path d="M6.9 6.9a7 7 0 1 0 9.9 0" />
              </svg>

              <span class="text-sm font-medium">
                  {{ question.isActive ? 'Deaktiv et' : 'Aktiv et' }}
                </span>
            </button>

            <button type="button" (click)="delete(question.id)" class="inline-flex text-white items-center px-3 py-2 border border-gray-300 rounded-lg bg-red-500 text-gray-700 hover:cursor-pointer hover:bg-red-700 transition-colors duration-200">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                   class="w-5 h-5" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                <path d="M10 11v6M14 11v6"/>
                <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
              </svg>
              <span class="text-sm font-medium">Sil</span>
            </button>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- модалка всегда в дереве -->
<app-new-question
  #createModal
  [inputs]="inputs">
</app-new-question>
